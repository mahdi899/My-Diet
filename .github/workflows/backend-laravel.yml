name: backend-laravel
on:
  push:
    paths: ['backend-laravel/**', 'frontend/**', 'doctor/**', 'tool/test-laravel.cjs', 'tool/laravel-browser.spec.cjs', '.github/workflows/backend-laravel.yml']
  pull_request:
    paths: ['backend-laravel/**', 'frontend/**', 'doctor/**', 'tool/test-laravel.cjs', 'tool/laravel-browser.spec.cjs', '.github/workflows/backend-laravel.yml']
jobs:
  standalone:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_test_only
          MYSQL_DATABASE: sabzine_test
          MYSQL_USER: sabzine_test
          MYSQL_PASSWORD: test_only
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_test_only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_ROLE: api
      NODE_ENV: development
      DATABASE_URL: mysql://sabzine_test:test_only@127.0.0.1:33306/sabzine_test
      MYSQL_TEST_URL: mysql://sabzine_test:test_only@127.0.0.1:33306/sabzine_test
      MYSQL_BACKUP_TEST_URL: mysql://root:root_test_only@127.0.0.1:33306/sabzine_test
      MYSQL_HOME: /usr
      PHP_BINARY: php
      DB_CONNECTION: mysql
      CACHE_STORE: array
      SESSION_DRIVER: array
      SMS_PROVIDER: console
      OTP_FIXED_CODE: '123456'
      JWT_SECRET: test-only-cross-runtime-jwt-secret
      OTP_PEPPER: test-only-cross-runtime-otp-pepper
      FIELD_KEY: test-only-cross-runtime-field-key
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backend-laravel
            frontend
            doctor
            tool
            .github
      - name: Verify legacy backend is absent
        run: test ! -d backend
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, sodium, mbstring, openssl, curl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y mysql-client
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend-laravel
      - run: php artisan migrate --force --no-interaction
        working-directory: backend-laravel
        env:
          DATABASE_URL: mysql://root:root_test_only@127.0.0.1:33306/sabzine_test
      - run: php vendor/bin/phpunit --fail-on-skipped
        working-directory: backend-laravel
      - run: npm ci && npm run typecheck && npm run build
        working-directory: frontend
      - run: node tool/laravel-contracts.cjs --check
      - run: npm install --prefix .tools/browser-tests --no-save --package-lock=false playwright
      - run: node .tools/browser-tests/node_modules/playwright/cli.js install --with-deps chromium
      - run: node --test tool/laravel-browser.spec.cjs
      - run: docker compose -f backend-laravel/docker-compose.yml config --quiet
      - run: docker build --target api -f backend-laravel/Dockerfile -t sabzine-php-ci .
      - run: docker build --target web -f backend-laravel/Dockerfile -t sabzine-web-ci .
