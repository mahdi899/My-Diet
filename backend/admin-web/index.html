<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت سبزینه</title><link rel="stylesheet" href="/admin/style.css"><script src="/admin/integrations.js" defer></script><script src="/admin/app.js" defer></script></head>
<body><section id="login"><div class="brand">سبزینه <small>پنل مدیریت</small></div><h1>خوش آمدید</h1><p>برای مدیریت سبزینه وارد حساب خود شوید.</p><form id="login-form"><label>نام کاربری<input name="username" autocomplete="username" required maxlength="80" dir="ltr"></label><label>رمز عبور<input name="password" type="password" autocomplete="current-password" required maxlength="256" dir="ltr"></label><button>ورود به پنل</button></form><form id="totp-form" hidden><label>کد ورود دومرحله‌ای<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><button>تأیید و ورود</button></form></section>
<div id="panel" hidden><aside><div class="brand">سبزینه<small>مدیریت و نظارت</small></div><nav id="nav"></nav><button id="logout" class="secondary">خروج از حساب</button></aside><main><header><div><p>فضای کاری مدیریت</p><h1 id="title">داشبورد</h1></div><button id="refresh" class="secondary">به‌روزرسانی</button></header><div id="content"></div></main></div><p id="message" role="status" aria-live="polite"></p></body></html>
