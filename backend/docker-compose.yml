services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sabzine
      POSTGRES_PASSWORD: sabzine
      POSTGRES_DB: sabzine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabzine -d sabzine"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sabzine_pg:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      APP_ROLE: api
      PORT: 3000
      DATABASE_URL: postgres://sabzine:sabzine@postgres:5432/sabzine
      DATABASE_REPLICA_URL: postgres://sabzine:sabzine@postgres:5432/sabzine
      RUN_MIGRATIONS: "true"
      SMS_PROVIDER: console
      PAYMENT_GATEWAY: sandbox
      AI_PROVIDER: fake
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: development
      APP_ROLE: worker
      WORKER_PORT: 3001
      DATABASE_URL: postgres://sabzine:sabzine@postgres:5432/sabzine
      DATABASE_REPLICA_URL: postgres://sabzine:sabzine@postgres:5432/sabzine
      SMS_PROVIDER: console
      PAYMENT_GATEWAY: sandbox
      AI_PROVIDER: fake
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sabzine_pg:
