<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#153e35">
  <title>رژیم من | پنل پزشک</title>
  <link rel="icon" href="/admin/logo.png?v=2" type="image/png">
  <link rel="preload" href="/admin/fonts/Vazirmatn-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/admin/style.css?v=logo-2">
  <link rel="stylesheet" href="/admin/clinical.css">
  <link rel="stylesheet" href="/admin/plan-review.css">
  <link rel="stylesheet" href="/admin/messaging.css?v=changes-3">
  <link rel="stylesheet" href="/admin/staff-tables.css?v=1">
  <link rel="stylesheet" href="/admin/doctor-panel.css?v=14">
  <script src="/admin/ui.js?v=chat-icons-1" defer></script>
  <script src="/admin/staff-session.js?v=messagefa-1" defer></script>
  <script src="/admin/workspace-ui.js" defer></script>
  <script src="/admin/meal-quality.js" defer></script>
  <script src="/admin/weekly-reports.js?v=user-report-6" defer></script>
  <script src="/admin/clinical-repository.js" defer></script>
  <script src="/admin/clinical-workspace.js" defer></script>
  <script src="/admin/plan-review.js" defer></script>
  <script src="/admin/messaging-repository.js?v=extra-request-1" defer></script>
  <script src="/admin/messaging-workspace.js?v=changes-6" defer></script>
  <script src="/admin/connection-gate.js?v=4" defer></script>
  <script src="/admin/specialist.js?v=no-chat-1" defer></script>
</head>
<body class="doctor-portal">
  <a class="skip-link" href="#main">رفتن به محتوای اصلی</a>
  <section id="login" class="login-layout" aria-label="ورود به پنل پزشک">
    <div class="login-form-area"><div class="login-form-wrap">
      <h1>متخصص گرامی خوش آمدید!</h1>
      <p id="login-state" class="form-error" role="alert"></p>
      <form id="phone-form">
        <label>شماره تلفن<input name="phone" inputmode="tel" autocomplete="tel" required dir="ltr" maxlength="13" placeholder="۰۹۱۲۳۴۵۶۷۸۹"></label>
        <button type="submit" class="login-submit">دریافت کد ورود <span data-icon="arrow-left"></span></button>
      </form>
      <form id="password-form" hidden>
        <label>نام کاربری<input name="username" autocomplete="username" required dir="ltr" maxlength="32" placeholder="doctor.name"></label>
        <label>رمز عبور<div class="password-field"><input id="login-password" name="password" type="password" autocomplete="current-password" required dir="ltr" maxlength="256" placeholder="رمز عبور شما"><button id="password-toggle" type="button" class="icon-button" aria-label="نمایش رمز عبور" aria-pressed="false"><span data-icon="eye"></span></button></div></label>
        <button type="submit" class="login-submit">ورود به پنل <span data-icon="arrow-left"></span></button>
      </form>
      <form id="code-form" hidden>
        <label>کد ورود<input name="code" inputmode="numeric" autocomplete="one-time-code" required dir="ltr" maxlength="6" placeholder="کد شش‌رقمی"></label>
        <button type="submit" class="login-submit">ورود به پنل <span data-icon="arrow-left"></span></button>
        <button id="change-phone" class="secondary" type="button">تغییر شماره</button>
      </form>
      <form id="totp-form" hidden>
        <div class="info-note"><span data-icon="shield"></span><p>کد شش‌رقمی برنامهٔ احراز هویت خود را وارد کنید.</p></div>
        <label>کد ورود دومرحله‌ای<input name="code" inputmode="numeric" autocomplete="one-time-code" required dir="ltr" maxlength="6"></label>
        <button type="submit" class="login-submit">تأیید و ورود <span data-icon="arrow-left"></span></button>
      </form>
      <button id="login-method" class="secondary" type="button">ورود با نام کاربری و رمز</button>
    </div></div>
  </section>
  <div id="panel" hidden>
    <button id="sidebar-backdrop" class="sidebar-backdrop" aria-label="بستن منوی کناری" tabindex="-1" hidden></button>
    <aside id="sidebar" aria-label="منوی اصلی">
      <div class="sidebar-brand"><a class="brand" href="#dashboard"><img class="brand-logo" src="/admin/logo.png?v=2" alt="" width="34" height="34"><div>رژیم من</div></a><button id="menu-close" class="icon-button" aria-label="بستن منو"><span data-icon="close"></span></button></div>
      <nav id="nav" aria-label="بخش‌های پنل پزشک"></nav>
      <div class="sidebar-bottom"><div class="profile"><span class="avatar" id="sidebar-avatar">پ</span><div><strong id="sidebar-profile-name">پزشک</strong></div></div><button id="logout" class="logout-button" aria-label="خروج از حساب"><span data-icon="logout"></span></button></div>
    </aside>
    <div class="workspace">
      <div class="topbar"><div class="topbar-location"><button id="menu-toggle" class="icon-button" aria-label="باز کردن منو" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span></button><span class="topbar-home" data-icon="grid"></span><span>فضای پزشک</span><span class="breadcrumb-divider">/</span><strong id="breadcrumb">داشبورد</strong></div><div class="topbar-meta"><span class="today"><span data-icon="calendar"></span><time id="today"></time></span><div class="account-menu"><button type="button" id="account-toggle" class="topbar-avatar" aria-label="حساب پزشک" aria-haspopup="true" aria-expanded="false" aria-controls="account-menu">پ</button><div id="account-menu" class="account-dropdown" hidden><button type="button" id="logout-menu"><span data-icon="logout"></span> خروج از حساب</button></div></div></div></div>
      <main id="main" tabindex="-1"><header class="page-heading"><div><div class="page-eyebrow" id="page-eyebrow">نمای کلی</div><h1 id="title" tabindex="-1">داشبورد</h1><p id="page-description">شما در این صفحه می‌توانید پرونده‌ها و برنامه‌های در انتظار بررسی را مشاهده کنید.</p></div><div id="page-actions" class="actions"><button id="refresh" class="secondary" type="button"><span data-icon="history"></span> به‌روزرسانی</button></div></header><div id="content" aria-live="polite"></div><footer class="workspace-footer"><span>طراحی شده با عشق توسط اکادمی رستمی</span></footer></main>
    </div>
  </div>
  <div id="message" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
