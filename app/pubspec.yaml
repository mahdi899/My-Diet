name: sabzine_flutter
description: Persian RTL nutrition mobile app UI with three demo panels.
publish_to: none
version: 1.0.0+2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: 2.5.5
  http: 1.6.0
  flutter_secure_storage: 9.2.4
  file_picker: 10.3.10
  record: 6.2.0
  audioplayers: 6.5.1
  url_launcher: 6.3.3
  flutter_animate: ^4.5.2
  image_picker: ^1.2.4
  lottie: ^3.8.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: 2.4.2
flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/brand/
    - assets/photo/manifest.json
    - assets/photo/food/
    - assets/photo/expert/
    - assets/photo/lifestyle/
    - assets/photo/ingredient/
    - assets/images/analysis/scan_hologram.png
    - assets/images/journey/
    - assets/images/home/
    - assets/images/brand_scenes/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
